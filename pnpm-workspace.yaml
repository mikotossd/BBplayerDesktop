packages:
  - apps/*
  - packages/*
allowBuilds:
  electron: true
  esbuild: true
  lefthook: true
  # wrangler(miniflare) 的图片处理依赖 —— apps/backend 本地开发要用
  sharp: true
  # jest-resolve 的平台解析器 —— packages/splash 的测试要用
  unrs-resolver: true
  workerd: true
  # 只用于 Squirrel.Windows target；我们用 NSIS + portable，不需要它的构建脚本
  electron-winstaller: false
