name: Build Desktop

# 默认只构建 **Windows 安装版**：v0.1.0 只发这一个产物。
#
# Linux（deb / rpm / AppImage）**属于 TODO，不参与发版**，所以：
#   * tag 触发时只跑 windows job；
#   * linux 与 verify-deb 只在手动触发且显式选 `windows+linux` 时才跑。
# 原因见 README 的 TODO 与 apps/desktop/README.md 的「已知限制 / 下一步」：
# Linux 那套构建配置是齐的（也曾在 Debian 12 真机验过），但缺**跨发行版**验证 ——
# ALSA 依赖名改过（`libasound2` → `libasound2t64`），
# 而下面 verify-deb 这套四发行版容器实测**一次都没跑过**（开发机是 Windows，
# 没有 docker / WSL）。跑绿之前不要把它接进发版流程。
#
# ⚠️ 未签名：Windows SmartScreen 会提示，属预期（见 docs/DESKTOP_PLAN.md Phase 5.3）。
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '构建目标'
        required: true
        default: windows
        type: choice
        options:
          - windows
          - windows+linux
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: 📦 Windows
    runs-on: windows-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: true

      - name: 🚀 Build
        run: pnpm --filter @bbplayer/desktop build:win

      - name: 📤 Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bbplayer-desktop-Windows
          # 只传安装版；portable 会一并产出但本版不发布
          path: dist/*-nsis-setup.exe
          if-no-files-found: error

  linux:
    name: 📦 Linux（TODO，未验证）
    if: github.event_name == 'workflow_dispatch' && inputs.targets == 'windows+linux'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: true

      - name: 🔧 Install rpm tooling
        # electron-builder 打 rpm 需要系统里有 rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: 🚀 Build
        run: pnpm --filter @bbplayer/desktop build:linux

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bbplayer-desktop-Linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------
  # deb 的真实安装验证（TODO 的一部分，未跑过）
  # ---------------------------------------------------------------
  #
  # 拦的是一类**只能靠真装一次才发现**的问题：依赖清单里写的库名在某些
  # 发行版上不存在。实测踩到过一次 —— `Depends: libasound2` 在 Ubuntu 24.04
  # 起找不到（该包改名成了 `libasound2t64`），`apt install ./xxx.deb` 直接失败；
  # 而当时只在 Debian 12 上验过，那里旧名字还成立，所以一直是绿的。
  #
  # 所以这里**横向铺开四个发行版**，覆盖改名前后两代：
  #   debian:12 / ubuntu:22.04 —— 旧名 libasound2
  #   ubuntu:24.04 / debian:trixie(13) —— 新名 libasound2t64
  #
  # 判据不是"apt 退出码为 0"，而是装完之后**跑一次产物自检**并读它打印的
  # `__SELFCHECK__` 行 —— 装上但起不来同样算失败。
  verify-deb:
    name: 🧪 deb on ${{ matrix.distro }}
    needs: linux
    if: github.event_name == 'workflow_dispatch' && inputs.targets == 'windows+linux'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:12
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:trixie
    steps:
      - name: 📥 Download deb
        uses: actions/download-artifact@v4
        with:
          name: bbplayer-desktop-Linux
          path: dist

      - name: 🧪 Install and self-check on ${{ matrix.distro }}
        run: |
          set -euo pipefail
          ls -l dist/

          docker run --rm -v "$PWD/dist:/dist:ro" ${{ matrix.distro }} bash -lc '
            set -euo pipefail

            # xvfb 单独装、单独一步：Electron 即使 --headless 也要一个 display，
            # 但把它和 deb 混在一条 apt 命令里会让"依赖解析失败"被别的输出淹没。
            apt-get update -qq
            apt-get install -y -qq xvfb

            DEB=$(find /dist -name "*.deb" -print -quit)
            echo "--- 安装 $DEB（依赖不可满足会在这里就非 0 退出）---"
            apt-get install -y -qq "$DEB"

            echo "--- 可执行文件 ---"
            command -v bbplayer

            echo "--- 依赖里的 ALSA（音乐播放器必须声明）---"
            dpkg -s bbplayer | grep -i "^Depends" | tr "," "\n" | grep -i -E "asound|alsa" \
              || { echo "⚠️ 依赖清单里没有 ALSA"; exit 1; }

            echo "--- 产物自检 ---"
            # 探针模式必须隔离数据目录：main.cjs 在没设 BBPLAYER_DATA_DIR 时会
            # 直接退出码 2（不给的话它会写进真实的 ~/.config/BBPlayer）。
            export BBPLAYER_DATA_DIR="$(mktemp -d)"
            # -m1：拿到第一行就停，避免 grep|head 触发 SIGPIPE 把管道判成失败
            xvfb-run -a bbplayer --no-sandbox --headless --selfcheck 2>&1 \
              | grep -m1 -o "__SELFCHECK__.*"
          '
